    <script>
      // Restaura la ruta cuando GitHub Pages devuelve 404.html en un enlace directo.
      ;(function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, location.pathname.slice(0, -1) + decoded + location.hash)
        }
      })(window.location)
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
